plugins { id 'java-library' }

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'org.apache.commons:commons-lang3:3.8.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
    implementation 'org.joml:joml:1.10.8'
    implementation 'com.google.guava:guava:33.3.1-jre'
    implementation 'org.yaml:snakeyaml:2.5'
    implementation 'net.bytebuddy:byte-buddy:1.15.11'
    implementation 'org.objenesis:objenesis:3.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Both loaders package this same locally generated gameplay type inventory.
def rollbackCatalogDirectory = layout.buildDirectory.dir('generated/rollbackCatalog')
tasks.register('generateRollbackGameplayCatalog') {
    dependsOn tasks.named('compileJava')
    inputs.files(sourceSets.main.output.classesDirs)
    outputs.dir(rollbackCatalogDirectory)
    doLast {
        def names = new TreeSet<String>()
        sourceSets.main.output.classesDirs.files.each { root ->
            if (root.exists()) fileTree(root).matching { include '**/*.class' }.files.each { compiled ->
                def name = root.toPath().relativize(compiled.toPath()).toString().replace('\\', '.').replace('/', '.')
                name = name.substring(0, name.length() - 6)
                if (!name.endsWith('package-info') && name != 'module-info') names.add(name)
            }
        }
        def target = rollbackCatalogDirectory.get().file('META-INF/projectkorra/rollback-gameplay.types').asFile
        target.parentFile.mkdirs()
        target.setText(names.join('\n') + '\n', 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(rollbackCatalogDirectory)
tasks.named('processResources') { dependsOn tasks.named('generateRollbackGameplayCatalog') }
